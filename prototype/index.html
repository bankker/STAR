<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star · 虚拟艺人</title>
  <link rel="stylesheet" href="/claude.css">
</head>
<body>
  <div class="app">
    <!-- 左侧：艺人列表（会话列表） -->
    <aside class="rail">
      <div class="rail-top">
        <div class="brand">✶ Star</div>
        <button class="new-artist" id="newArtist"><span>＋</span> 新建艺人</button>
      </div>
      <div class="rail-label">艺人</div>
      <div class="artist-list" id="artistList"></div>
      <div class="rail-foot">
        <a href="/studio.html" class="rail-foot-link">⚙ 创作工作室（完整工具）→</a>
      </div>
    </aside>

    <!-- 主区：对话即界面 -->
    <main class="main">
      <div class="conv-empty" id="convEmpty">
        <div class="conv-empty-inner">
          <div class="conv-empty-mark">✶</div>
          <h1>和你的虚拟艺人对话</h1>
          <p>在左侧选择一位艺人开始；或「新建艺人」，通过一段对话把 Ta 创设出来。聊天、写真——都在这一条对话里完成。</p>
        </div>
      </div>

      <div class="conv" id="conv" hidden>
        <header class="conv-head" id="convHead"></header>
        <div class="thread" id="thread"><div class="thread-inner" id="threadInner"></div></div>
        <div class="composer-wrap">
          <div class="suggest" id="suggest"></div>
          <div class="composer" id="composer">
            <button class="composer-plus" id="composerPlus" title="创作">＋</button>
            <textarea id="input" rows="1" placeholder="对 Ta 说点什么…"></textarea>
            <button class="composer-send" id="send" title="发送">↑</button>
          </div>
          <div class="composer-hint" id="composerHint"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="cmenu" id="cmenu" hidden></div>
  <div class="toast" id="toast"></div>
  <script src="/claude.js"></script>
</body>
</html>
