<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#05050f;font-family:'Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased;}
  @keyframes nebDrift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-14px,8px) scale(1.04);}}
  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
  @keyframes caret{0%,100%{opacity:1;}50%{opacity:0;}}
  @keyframes statFloat{0%{transform:translateY(0);opacity:0;}15%{opacity:1;}100%{transform:translateY(-58px);opacity:0;}}
  @keyframes contBob{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(4px);opacity:1;}}
  @keyframes optIn{0%{transform:translateX(28px);opacity:0;}100%{transform:translateX(0);opacity:1;}}
</style>
</helmet>
<div style="position:fixed;inset:0;background:#05050f;display:flex;align-items:center;justify-content:center;overflow:hidden;">
  <div ref="{{ stageRef }}" style="{{ stageStyle }}">

    <!-- ================= BACKGROUND SCENE ================= -->
    <!-- deep interior base -->
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse 120% 80% at 50% 30%,#181233,#0a0a1c 70%,#06060f);"></div>

    <!-- observation window with nebula -->
    <div style="position:absolute;top:66px;left:54px;right:54px;height:560px;clip-path:polygon(36px 0,calc(100% - 36px) 0,100% 36px,100% calc(100% - 18px),calc(100% - 60px) 100%,60px 100%,0 calc(100% - 18px),0 36px);overflow:hidden;box-shadow:inset 0 0 120px rgba(0,0,0,.7);">
      <!-- nebula -->
      <div style="position:absolute;inset:-60px;animation:nebDrift 26s ease-in-out infinite;background:radial-gradient(ellipse 42% 52% at 28% 38%,rgba(255,86,148,.55),transparent 62%),radial-gradient(ellipse 50% 44% at 64% 26%,rgba(150,92,255,.5),transparent 62%),radial-gradient(ellipse 46% 56% at 52% 60%,rgba(58,196,214,.34),transparent 62%),radial-gradient(ellipse 32% 34% at 80% 64%,rgba(255,168,92,.34),transparent 60%),radial-gradient(ellipse 40% 40% at 14% 74%,rgba(120,80,220,.34),transparent 64%),#0c0a22;"></div>
      <!-- stars -->
      <div style="{{ starStyle }}"></div>
      <!-- distant planet -->
      <div style="position:absolute;left:11%;top:50%;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#ffd9a8,#e07a4a 46%,#7a2f3a 78%,#2a1230);box-shadow:0 0 60px rgba(255,140,90,.4),inset -12px -10px 30px rgba(0,0,0,.55);"></div>
      <div style="position:absolute;left:8%;top:54%;width:200px;height:46px;border-radius:50%;border:2px solid rgba(255,200,150,.4);transform:rotate(-18deg);box-shadow:0 0 18px rgba(255,200,150,.25);"></div>
      <!-- atmosphere haze + scanline -->
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,30,.1),rgba(10,8,24,.5));"></div>
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(120,200,230,0) 0px,rgba(120,200,230,0) 3px,rgba(90,170,210,.04) 4px);"></div>
    </div>
    <!-- window frame mullions -->
    <div style="position:absolute;top:66px;left:54px;right:54px;height:560px;pointer-events:none;clip-path:polygon(36px 0,calc(100% - 36px) 0,100% 36px,100% calc(100% - 18px),calc(100% - 60px) 100%,60px 100%,0 calc(100% - 18px),0 36px);border:2px solid rgba(95,210,235,.34);box-shadow:inset 0 0 40px rgba(60,180,220,.12);"></div>
    <div style="position:absolute;top:66px;bottom:454px;left:50%;width:3px;background:linear-gradient(180deg,transparent,rgba(95,210,235,.34),transparent);transform:translateX(-300px);"></div>
    <div style="position:absolute;top:66px;bottom:454px;left:50%;width:3px;background:linear-gradient(180deg,transparent,rgba(95,210,235,.34),transparent);transform:translateX(300px);"></div>

    <!-- interior lower wall + warm rim -->
    <div style="position:absolute;left:0;right:0;top:560px;bottom:0;background:linear-gradient(180deg,rgba(20,16,34,.2),#0a0814 60%);"></div>
    <div style="position:absolute;left:0;right:0;top:560px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,150,110,.4),rgba(95,210,235,.3),transparent);"></div>
    <!-- faint console silhouettes -->
    <div style="position:absolute;left:80px;bottom:0;width:360px;height:120px;background:linear-gradient(180deg,rgba(14,22,34,.0),rgba(12,20,32,.8));clip-path:polygon(0 40%,12% 40%,16% 0,30% 0,34% 40%,100% 40%,100% 100%,0 100%);"></div>
    <div style="position:absolute;right:60px;bottom:0;width:420px;height:140px;background:linear-gradient(180deg,rgba(14,22,34,.0),rgba(12,20,32,.7));clip-path:polygon(0 50%,60% 50%,64% 10%,80% 10%,84% 50%,100% 50%,100% 100%,0 100%);"></div>
    <!-- warm ambient glow toward character -->
    <div style="position:absolute;right:0;bottom:0;width:1100px;height:900px;background:radial-gradient(ellipse 60% 60% at 70% 60%,rgba(255,150,90,.16),transparent 65%);pointer-events:none;"></div>

    <!-- ================= CHARACTER PORTRAIT ================= -->
    <div style="{{ portraitStyle }}"></div>
    <!-- soft ground shadow -->
    <div style="position:absolute;right:300px;bottom:8px;width:560px;height:60px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,0,0,.5),transparent 70%);"></div>

    <!-- ================= TOP HUD · AFFINITY ================= -->
    <div data-screen-label="好感度HUD" style="position:absolute;top:84px;left:78px;display:flex;align-items:center;gap:14px;padding:11px 22px 11px 12px;background:linear-gradient(160deg,rgba(14,22,36,.82),rgba(8,14,24,.78));border:1px solid rgba(95,210,235,.32);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);box-shadow:0 6px 24px rgba(0,0,0,.45),inset 0 0 20px rgba(60,180,220,.1);backdrop-filter:blur(6px);z-index:30;">
      <div style="{{ avatarStyle }}"></div>
      <div style="display:flex;flex-direction:column;gap:5px;min-width:236px;">
        <div style="display:flex;align-items:baseline;justify-content:space-between;">
          <span style="font-weight:700;font-size:16px;letter-spacing:1px;color:#f3ead8;">{{ charName }}</span>
          <span style="font-size:11px;letter-spacing:2px;color:#ff8fb6;">{{ charRole }}</span>
        </div>
        <div style="position:relative;height:9px;background:rgba(8,16,26,.9);border:1px solid rgba(255,143,182,.4);border-radius:5px;overflow:hidden;">
          <div style="{{ affinityFillStyle }}"></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:10px;letter-spacing:2px;color:#9a8aa0;">好感度</span>
          <span style="font-size:11px;letter-spacing:1px;color:#ffb0cf;font-weight:700;white-space:nowrap;">{{ affinityStage }} · <span style="font-family:'Oxanium';">{{ affinityText }}</span></span>
        </div>
      </div>
      <!-- floating stat feedback -->
      <div style="position:absolute;right:18px;top:-6px;">
        <sc-for list="{{ floats }}" as="f" hint-placeholder-count="0">
          <div style="{{ f.style }}">{{ f.text }}</div>
        </sc-for>
      </div>
    </div>

    <!-- ================= TOP-RIGHT CONTROLS ================= -->
    <div style="position:absolute;top:84px;right:78px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:30;">
      <div style="display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;color:#7fb6c8;">
        <span style="width:6px;height:6px;background:#ff9a5a;transform:rotate(45deg);box-shadow:0 0 8px #ff9a5a;"></span>
        {{ location }}
      </div>
      <div style="display:flex;gap:8px;">
        <button style="padding:6px 14px;font-size:12px;letter-spacing:2px;color:#8fd0de;background:rgba(12,24,38,.8);border:1px solid rgba(95,210,235,.3);border-radius:3px;cursor:pointer;font-family:'Noto Sans SC';">自动</button>
        <button style="padding:6px 14px;font-size:12px;letter-spacing:2px;color:#8fd0de;background:rgba(12,24,38,.8);border:1px solid rgba(95,210,235,.3);border-radius:3px;cursor:pointer;font-family:'Noto Sans SC';">记录</button>
        <button style="width:34px;height:34px;font-size:15px;color:#8fd0de;background:rgba(12,24,38,.8);border:1px solid rgba(95,210,235,.3);border-radius:3px;cursor:pointer;">⚙</button>
      </div>
    </div>

    <!-- ================= OPTIONS ================= -->
    <sc-if value="{{ isChoice }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:120px;bottom:332px;display:flex;flex-direction:column;gap:14px;width:660px;z-index:25;">
        <sc-for list="{{ options }}" as="opt" hint-placeholder-count="3">
          <button onClick="{{ opt.onClick }}" style="{{ opt.style }}">
            <span style="flex:1;text-align:left;font-size:17px;letter-spacing:.5px;color:#eaf4ff;line-height:1.3;">{{ opt.text }}</span>
            <span style="{{ opt.tagStyle }}">
              <span style="{{ opt.iconStyle }}"></span>
              {{ opt.tagLabel }}
            </span>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <!-- ================= DIALOGUE BOX ================= -->
    <div onClick="{{ onAdvance }}" style="position:absolute;left:70px;right:70px;bottom:54px;height:236px;z-index:20;cursor:pointer;">
      <!-- name plate -->
      <div style="position:absolute;top:-26px;left:46px;z-index:6;display:flex;align-items:center;gap:10px;padding:8px 26px;background:linear-gradient(120deg,rgba(255,120,80,.32),rgba(14,24,38,.95));border:1px solid rgba(255,150,110,.55);clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 22px rgba(255,140,90,.2);">
        <span style="width:7px;height:7px;background:#ff9a5a;transform:rotate(45deg);box-shadow:0 0 10px #ff9a5a;"></span>
        <span style="font-weight:700;font-size:19px;letter-spacing:2px;color:#ffd9b8;text-shadow:0 0 14px rgba(255,150,90,.5);">{{ speaker }}</span>
      </div>
      <!-- glass body -->
      <div style="position:absolute;inset:0;background:linear-gradient(160deg,rgba(14,26,42,.84),rgba(8,14,26,.9));border:1px solid rgba(95,210,235,.36);clip-path:polygon(24px 0,100% 0,100% calc(100% - 24px),calc(100% - 24px) 100%,0 100%,0 24px);box-shadow:inset 0 0 50px rgba(50,150,200,.1),0 10px 40px rgba(0,0,0,.55);backdrop-filter:blur(8px);"></div>
      <div style="position:absolute;top:0;left:24px;right:0;height:2px;background:linear-gradient(90deg,rgba(95,210,235,.6),transparent);"></div>
      <!-- text -->
      <div style="position:absolute;top:40px;left:54px;right:80px;font-size:25px;line-height:1.62;color:#e8f1fb;letter-spacing:.5px;text-shadow:0 1px 4px rgba(0,0,0,.5);">{{ typedText }}<span style="{{ caretStyle }}">▌</span></div>
      <!-- continue indicator -->
      <div style="{{ continueStyle }}">▼ 点击继续</div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.stageRef = React.createRef();
    this.uri = (s)=>'data:image/svg+xml,'+encodeURIComponent(s);
    this._pcache = {};
    this.state = { node:'start', shown:0, typing:true, affinity:64, floats:[], fid:0 };
    this.buildAssets();
  }
  componentDidMount(){
    this.fit(); requestAnimationFrame(()=>this.fit()); this._fit=()=>this.fit(); window.addEventListener('resize', this._fit); window.addEventListener('load', this._fit); if(window.ResizeObserver){ this._ro=new ResizeObserver(()=>this.fit()); this._ro.observe(document.documentElement); }
    this._lastNode='start';
    clearInterval(this._tick);
    this._tick=setInterval(()=>this.tick(),24);
  }
  componentWillUnmount(){ window.removeEventListener('resize', this._fit); window.removeEventListener('load', this._fit); if(this._ro) this._ro.disconnect(); clearInterval(this._tick); }
  tick(){
    this.setState(s=>{
      const text=this.nodes[s.node].text;
      if(this._lastNode!==s.node){ this._lastNode=s.node; return {shown:0,typing:true}; }
      if(s.shown<text.length){ const n=s.shown+1; return {shown:n,typing:n<text.length}; }
      if(s.typing) return {typing:false};
      return null;
    });
  }
  fit(){ const el=this.stageRef.current; if(!el){ requestAnimationFrame(()=>this.fit()); return; } const w=window.innerWidth||document.documentElement.clientWidth, h=window.innerHeight||document.documentElement.clientHeight; const s=Math.min(w/1920,h/1080); if(!(s>0)){ requestAnimationFrame(()=>this.fit()); return; } el.style.transform=`scale(${s})`; }

  buildAssets(){
    const U=this.uri;
    let stars=''; for(let i=0;i<90;i++){const x=(Math.random()*1800)|0,y=(Math.random()*560)|0,r=(Math.random()*1.5+.3).toFixed(1),o=(Math.random()*.8+.2).toFixed(2);stars+=`<circle cx='${x}' cy='${y}' r='${r}' fill='#fff' opacity='${o}'/>`;}
    this.starUri=U(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1800 560'>${stars}</svg>`);

    this.nodes = {
      start:{speaker:'凯拉·沃斯',mood:'neutral',text:'（她放下手里的炮管校准仪，侧过头看你）这一轮齐射……要不是你替我压住了节奏，我差点就让主炮过载了。',next:'q1'},
      q1:{speaker:'凯拉·沃斯',mood:'neutral',text:'……该怎么说呢。和你并肩站在舰桥上的时候，我总觉得很安心。',choices:[
        {text:'你的判断，我从来都信得过。',tag:'好感',delta:5,goto:'a_aff'},
        {text:'过载阈值，我已经帮你重算过一遍了。',tag:'能力',delta:5,goto:'a_abi'},
        {text:'因为我们配合得越来越默契了。',tag:'协同',delta:5,goto:'a_syn'}]},
      a_aff:{speaker:'凯拉·沃斯',mood:'blush',text:'……哼，被舰长这样直白地说出来，还真有点招架不住。',next:'mid'},
      a_abi:{speaker:'凯拉·沃斯',mood:'smile',text:'认真的？那下次主炮校准就交给你了——可别让我失望。',next:'mid'},
      a_syn:{speaker:'凯拉·沃斯',mood:'smile',text:'默契啊……嗯，是这个词没错。',next:'mid'},
      mid:{speaker:'凯拉·沃斯',mood:'neutral',text:'对了，舰桥刚传来消息——前方那片星云里探测到了异常信号。要不要……一起去看看？',choices:[
        {text:'走，我陪你去。',tag:'好感',delta:8,goto:'b_aff'},
        {text:'先让我调出传感器阵列的数据。',tag:'能力',delta:6,goto:'b_abi'}]},
      b_aff:{speaker:'凯拉·沃斯',mood:'bright',text:'成交。……有你在，再深的星渊，我也敢闯。',next:'end'},
      b_abi:{speaker:'凯拉·沃斯',mood:'smile',text:'稳重，我欣赏。数据我们就边走边看吧。',next:'end'},
      end:{speaker:'凯拉·沃斯',mood:'smile',text:'（这段对话，先到这里。点击可以重新开始。）',restart:'start'}
    };

    this.tagMeta = {
      '好感':{color:'#ff6fae',glow:'rgba(255,111,174,.5)',icon:'heart'},
      '能力':{color:'#4fd6e6',glow:'rgba(79,214,230,.5)',icon:'chip'},
      '协同':{color:'#ffcc4d',glow:'rgba(255,204,77,.5)',icon:'link'}
    };
  }

  tagIcon(type,c){
    const m={
      heart:`<path d='M24 40C10 30 6 20 12 13c4-5 10-3 12 2 2-5 8-7 12-2 6 7 2 17-12 27z' fill='${c}'/>`,
      chip:`<g fill='none' stroke='${c}' stroke-width='3.4'><rect x='14' y='14' width='20' height='20' rx='2'/><path d='M20 8v6M28 8v6M20 34v6M28 34v6M8 20h6M8 28h6M34 20h6M34 28h6' stroke-linecap='round'/></g>`,
      link:`<g fill='none' stroke='${c}' stroke-width='3.6' stroke-linecap='round'><path d='M20 28l8-8'/><path d='M26 14l3-3a7 7 0 0 1 10 10l-6 6a7 7 0 0 1-10 0'/><path d='M22 34l-3 3a7 7 0 0 1-10-10l6-6a7 7 0 0 1 10 0'/></g>`
    };
    return this.uri(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'>${m[type]}</svg>`);
  }

  portrait(mood){
    if(this._pcache[mood]) return this._pcache[mood];
    const skin='#f6cda2',skinL='#ffe8c8',skinD='#d49a6e',hair='#ff8a4a',hairD='#cf551c',hairL='#ffc089',
      jacket='#22384e',jacketL='#34546f',collar='#16273a',cyan='#5fe0ee',iris='#356a78',brow='#a85528',lip='#d97a64',under='#bfe0db';
    const blush=(mood==='blush'||mood==='bright')?0.42:0;
    const mouth=(mood==='smile')?'M250 360 q30 20 58 -2':(mood==='bright')?'M246 358 q32 26 62 -4':(mood==='blush')?'M256 364 q24 13 48 -1':'M254 366 q26 11 52 -1';
    const eyeH=(mood==='bright')?6:4;
    const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 840'>
      <ellipse cx='282' cy='320' rx='250' ry='320' fill='${hair}' opacity='.1'/>
      <ellipse cx='282' cy='250' rx='150' ry='170' fill='${cyan}' opacity='.06'/>
      <path d='M150 360 Q116 168 282 150 Q448 168 414 360 L426 540 Q360 486 282 486 Q204 486 138 540 Z' fill='${hairD}'/>
      <path d='M70 840 L70 600 Q92 498 184 470 L378 470 Q470 498 492 600 L492 840 Z' fill='${jacket}'/>
      <path d='M70 840 L70 600 Q92 498 184 470 L214 470 L150 840 Z' fill='${jacketL}' opacity='.55'/>
      <path d='M205 472 L282 566 L359 472 L341 472 L282 538 L222 472 Z' fill='${collar}'/>
      <path d='M236 472 L282 548 L328 472 Z' fill='${under}' opacity='.85'/>
      <path d='M205 472 L282 566 L359 472' fill='none' stroke='${hair}' stroke-width='3' opacity='.8'/>
      <path d='M96 560 Q150 506 214 512 L206 560 Q150 536 110 580 Z' fill='${jacketL}'/>
      <g><rect x='330' y='540' width='30' height='30' rx='3' fill='none' stroke='${cyan}' stroke-width='2.4' transform='rotate(45 345 555)' opacity='.9'/><circle cx='345' cy='555' r='5' fill='${cyan}'/></g>
      <path d='M250 402 L314 402 L316 474 L248 474 Z' fill='${skinD}'/>
      <path d='M258 406 L304 406 L302 466 L260 466 Z' fill='${skin}'/>
      <path d='M180 272 Q180 162 282 160 Q384 162 384 272 Q384 384 322 420 Q282 438 240 420 Q180 384 180 272 Z' fill='${skin}'/>
      <path d='M210 300 Q230 364 272 386 Q236 348 224 300 Q218 290 210 300 Z' fill='${skinL}' opacity='.6'/>
      <path d='M240 400 Q282 426 324 400 Q302 420 282 421 Q262 420 240 400 Z' fill='${skinD}' opacity='.4'/>
      <ellipse cx='234' cy='342' rx='20' ry='13' fill='${lip}' opacity='${blush}'/>
      <ellipse cx='332' cy='338' rx='18' ry='12' fill='${lip}' opacity='${blush}'/>
      <path d='M218 266 q24 -11 48 -3' fill='none' stroke='${brow}' stroke-width='6' stroke-linecap='round'/>
      <path d='M300 260 q22 -9 42 0' fill='none' stroke='${brow}' stroke-width='6' stroke-linecap='round'/>
      <path d='M222 288 q24 -13 50 -2 q-7 17 -30 17 q-17 0 -20 -15 Z' fill='#fdf7ee'/>
      <path d='M304 284 q22 -11 42 -2 q-6 15 -26 15 q-15 0 -16 -13 Z' fill='#fdf7ee'/>
      <circle cx='250' cy='292' r='11' fill='${iris}'/><circle cx='250' cy='292' r='5.5' fill='#16242b'/><circle cx='246' cy='288' r='3' fill='#fff'/>
      <circle cx='326' cy='289' r='10' fill='${iris}'/><circle cx='326' cy='289' r='5' fill='#16242b'/><circle cx='322' cy='285' r='2.6' fill='#fff'/>
      <path d='M222 288 q24 -13 50 -2' fill='none' stroke='#3a2a22' stroke-width='${eyeH}' stroke-linecap='round'/>
      <path d='M304 284 q22 -11 42 -2' fill='none' stroke='#3a2a22' stroke-width='${eyeH}' stroke-linecap='round'/>
      <path d='M270 302 L264 336 q9 7 19 2' fill='none' stroke='${skinD}' stroke-width='3.6' stroke-linecap='round' opacity='.7'/>
      <path d='${mouth}' fill='none' stroke='${lip}' stroke-width='6' stroke-linecap='round'/>
      <path d='M180 272 Q174 150 282 150 Q400 150 388 286 Q374 212 320 190 Q300 234 260 226 Q300 212 298 188 Q248 198 226 236 Q210 256 206 214 Q194 246 192 286 Q186 254 180 272 Z' fill='${hair}'/>
      <path d='M300 190 Q352 206 384 282 Q380 220 350 186 Q328 184 300 190 Z' fill='${hairL}' opacity='.55'/>
      <path d='M188 274 Q172 384 200 472 Q184 384 200 286 Z' fill='${hair}'/>
      <path d='M192 280 Q182 360 198 446 Q190 360 202 290 Z' fill='${hairL}' opacity='.5'/>
      <path d='M180 272 Q174 168 270 152' fill='none' stroke='${hairL}' stroke-width='5' stroke-linecap='round' opacity='.7'/>
      <path d='M70 600 Q92 498 184 470' fill='none' stroke='${hairL}' stroke-width='4' stroke-linecap='round' opacity='.4'/>
      <g opacity='.85'><rect x='372' y='300' width='14' height='30' rx='5' fill='${collar}'/><circle cx='379' cy='322' r='3.5' fill='${cyan}'/></g>
    </svg>`;
    this._pcache[mood]=this.uri(svg);
    return this._pcache[mood];
  }

  /* ---------- flow ---------- */
  cur(){ return this.nodes[this.state.node]; }
  setNode(id){ this._lastNode=id; this.setState({node:id,shown:0,typing:true}); }
  advance(){
    const c=this.cur();
    if(this.state.typing){ this.setState({shown:c.text.length,typing:false}); return; }
    if(c.choices) return;
    if(c.next) this.setNode(c.next);
    else if(c.restart){ this.setState({affinity:64}); this.setNode(c.restart); }
  }
  choose(opt){
    const meta=this.tagMeta[opt.tag];
    this.setState(s=>{
      const floats=[...s.floats,{id:s.fid,text:`${opt.tag} +${opt.delta}`,color:meta.color}];
      const aff = opt.tag==='好感' ? Math.min(100,s.affinity+opt.delta) : s.affinity;
      return {affinity:aff,floats,fid:s.fid+1};
    });
    const fidNow=this.state.fid;
    setTimeout(()=>this.setState(s=>({floats:s.floats.filter(f=>f.id!==fidNow)})),1500);
    this.setNode(opt.goto);
  }

  renderVals(){
    const st=this.state, c=this.cur(), typed=c.text.slice(0,st.shown);
    const isChoice=!!c.choices;
    const stage = st.affinity>=86?'羁绊':st.affinity>=70?'心动':st.affinity>=50?'信赖':'熟识';

    const options=(c.choices||[]).map(o=>{
      const m=this.tagMeta[o.tag];
      return { text:o.text, tagLabel:`${o.tag} +${o.delta}`, onClick:()=>this.choose(o),
        style:{ display:'flex',alignItems:'center',gap:'16px',padding:'15px 18px 15px 24px',cursor:'pointer',
          background:'linear-gradient(110deg,rgba(16,30,48,.92),rgba(10,18,30,.88))', border:'1px solid rgba(95,210,235,.4)',
          borderLeft:`3px solid ${m.color}`, clipPath:'polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))',
          boxShadow:`0 6px 20px rgba(0,0,0,.4)`, transition:'transform .14s, box-shadow .14s, border-color .14s', animation:'optIn .3s ease both',
          fontFamily:"'Noto Sans SC'" },
        'style-hover':{ transform:'translateX(10px)', borderColor:m.color, boxShadow:`0 6px 26px ${m.glow}, -4px 0 18px ${m.glow}` },
        tagStyle:{ display:'flex',alignItems:'center',gap:'7px',flex:'none',padding:'6px 13px',fontSize:'13px',fontWeight:700,letterSpacing:'1px',
          color:m.color, background:`${m.color}1a`, border:`1px solid ${m.color}`, borderRadius:'14px', boxShadow:`0 0 12px ${m.glow}` },
        iconStyle:{ width:'17px',height:'17px',backgroundImage:`url("${this.tagIcon(m.icon,m.color)}")`,backgroundSize:'contain',backgroundRepeat:'no-repeat' } };
    });

    const floats=st.floats.map(f=>({ text:f.text, style:{ position:'absolute',right:'0',top:'0',whiteSpace:'nowrap',
      padding:'4px 12px',fontSize:'14px',fontWeight:800,letterSpacing:'1px',color:f.color,
      background:`${f.color}22`,border:`1px solid ${f.color}`,borderRadius:'12px',boxShadow:`0 0 16px ${f.color}88`,
      animation:'statFloat 1.5s ease-out forwards' } }));

    return {
      stageRef:this.stageRef,
      stageStyle:{ position:'relative',width:'1920px',height:'1080px',transformOrigin:'center center',flex:'none',overflow:'hidden',background:'#06060f' },
      starStyle:{ position:'absolute',inset:0,backgroundImage:`url("${this.starUri}")`,backgroundSize:'cover',opacity:.9 },
      portraitStyle:{ position:'absolute',right:'150px',bottom:'-26px',width:'720px',height:'1060px',
        backgroundImage:`url("${this.portrait(c.mood||'neutral')}")`,backgroundSize:'contain',backgroundRepeat:'no-repeat',backgroundPosition:'bottom center',
        filter:'drop-shadow(0 12px 40px rgba(0,0,0,.6)) drop-shadow(-18px 0 50px rgba(255,150,90,.18))',zIndex:10 },
      avatarStyle:{ width:'56px',height:'56px',flex:'none',borderRadius:'8px',border:'1px solid rgba(255,143,182,.5)',
        backgroundImage:`url("${this.portrait('smile')}")`,backgroundSize:'260%',backgroundPosition:'48% 12%',boxShadow:'0 0 16px rgba(255,143,182,.3)' },
      charName:'凯拉·沃斯', charRole:'主炮手',
      affinity:st.affinity, affinityText:`${st.affinity}%`, affinityStage:stage,
      affinityFillStyle:{ height:'100%',width:`${st.affinity}%`,background:'linear-gradient(90deg,#ff6fae,#ffb0cf)',boxShadow:'0 0 12px rgba(255,111,174,.7)',transition:'width .5s cubic-bezier(.3,.9,.3,1)' },
      location:'「奥德赛」号 · 武器甲板 · 休整区',
      isChoice, options, floats,
      speaker:c.speaker, typedText:typed,
      caretStyle:{ color:'#5fe0ee',marginLeft:'2px',animation:'caret 1s step-end infinite',opacity: st.typing?1:0 },
      continueStyle:{ position:'absolute',bottom:'18px',right:'40px',fontSize:'14px',letterSpacing:'2px',color:'#7fd6e6',
        display:(!isChoice && !st.typing)?'block':'none',animation:'contBob 1.3s ease-in-out infinite' },
      onAdvance:()=>this.advance()
    };
  }
}
</script>
